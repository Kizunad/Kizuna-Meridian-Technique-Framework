plugins {
    id 'base'
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false
    id 'com.google.protobuf' version '0.9.6' apply false
}

allprojects {
    group = 'dev.kizuna.meridian.technique'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(17) }
        withSourcesJar()
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') { dependsOn ':shared:assemble', ':server:assemble', ':fabric:assemble' }
tasks.named('check') { dependsOn ':shared:check', ':server:check', ':fabric:check', 'checkDocs' }
tasks.named('clean') { dependsOn ':shared:clean', ':server:clean', ':fabric:clean' }
tasks.register('test') {
    group = 'verification'
    dependsOn ':shared:test', ':server:test', ':fabric:test'
}
tasks.register('checkDocs', Exec) {
    group = 'verification'
    commandLine 'python3', 'scripts/check_docs.py'
}
