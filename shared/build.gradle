apply plugin: 'com.google.protobuf'
description = '功法目录、绑定、进度与施放请求的跨语言 Protobuf 契约。'

dependencies {
    api libs.protobuf.java
    compileOnlyApi 'local.meridian:client'
}

def descriptor = layout.buildDirectory.file('descriptors/technique-v1.desc')
protobuf {
    // protoc 与运行库同版本，取版本目录中的 protobuf-java。
    protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" }
    generateProtoTasks {
        ofSourceSet('main').configureEach { task ->
            task.generateDescriptorSet = true
            task.descriptorSetOptions.path = descriptor.get().asFile.path
            task.descriptorSetOptions.includeImports = true
            task.descriptorSetOptions.includeSourceInfo = true
        }
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateProto')
    from(descriptor) { into 'META-INF/kizuna_meridian/protocol' }
}
