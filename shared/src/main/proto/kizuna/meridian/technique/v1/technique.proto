syntax = "proto3";
package kizuna.meridian.technique.v1;

import "kizuna/meridian/v1/body.proto";
import "kizuna/meridian/v1/protocol.proto";
import "kizuna/meridian/v1/activity.proto";

option java_package = "dev.kizuna.meridian.technique.protocol.pb";
option java_outer_classname = "TechniqueMessages";

// 定义不能携带执行代码；未知字段、枚举和算子均拒绝。字段删除必须 reserved。
// 所有 Quantity 必须显式提供 value 和正确单位，范围由目录校验器及 Wiki 固定。
enum Unit {
  UNIT_UNSPECIFIED = 0;
  QI = 1; // 元
  NEWTON = 2;
  WATT = 3;
  SECOND = 4;
  RATIO = 5; // 无量纲
  METERS_PER_SECOND = 6;
  METER = 7;
  DAMAGE_POINT = 8;
  DEGREE = 9;
}
message Quantity { optional double value = 1; Unit unit = 2; }
message TechniqueReference { string id = 1; int32 version = 2; }

message TechniqueCatalog {
  int32 schema_version = 1; // 1
  string namespace = 2;
  // 已在 AddonRegistry 登记的模板；按模块种类汇集其标签，拒绝未知标签。
  repeated kizuna.meridian.v1.TemplateReference binding_templates = 3;
  repeated TechniqueDefinition definitions = 4;
  repeated TechniqueBook books = 5;
  repeated TechniqueVolume volumes = 6;
}
message TechniqueBook {
  string id = 1;
  string display_name = 2;
  HeldItemRules held_item_rules = 3; // 缺省表示不要求持物
  LegRules leg_rules = 10; // 腿法书级条件与靴子参数
  ArmRules arm_rules = 11; // 拳掌书级条件；手里的东西不参与伤害、不扣耐久
}
message TechniqueVolume {
  string id = 1;
  string book_id = 2;
  string display_name = 3;
  repeated TechniqueReference techniques = 4; // 精确版本；一个式版本只属于一卷
  repeated string prerequisite_volume_ids = 5; // 同书前置卷，无环；学会其中全部式才满足
  repeated ScrollDrop scroll_drops = 6; // 生存来源：哪些生物掉本卷卷轴；至多 16 项，实体不重复
  optional bool scroll_item = 7; // 缺省生成 <卷>_scroll 物品；false 时没有卷轴，也不能声明掉落
}
// 生物被玩家杀死、且死者会本卷全部式时，按概率掉一份本卷卷轴；只加进该实体自带的掉落表。
message ScrollDrop {
  string entity_type = 1; // 实体类型 ID，namespace:path，须已注册
  double chance = 2; // (0, 1]
}
// 功法谱来源暗示：服务端各附属登记「谁身上有这一卷」，进服和来源变动时整份发给客户端；只用来拼展示句子。
message VolumeSources { repeated VolumeSource sources = 1; } // 至多 4096 项
message VolumeSource {
  string volume_id = 1; // 已登记卷轴的卷 ID
  oneof kind {
    VolumeKnower knower = 2;
    VolumeFoe foe = 3;
  }
}
// 某类生物出生在某一境时会这一卷；share 是那一境里会它的占比 (0, 1]。
message VolumeKnower {
  string entity_type = 1; // 实体类型 ID，namespace:path
  kizuna.meridian.v1.Realm realm = 2;
  double share = 3;
}
// 某个出身的仇家身上带着这一卷；origin_key 是出身显示名的语言键。
message VolumeFoe { string origin_key = 1; }
enum BaseDamageSource {
  BASE_DAMAGE_SOURCE_UNSPECIFIED = 0;
  ITEM_ATTACK_DAMAGE = 1;
  FIXED_DAMAGE = 2;
}
enum InjuryKind {
  INJURY_KIND_UNSPECIFIED = 0;
  CUTTING = 1;
  BLUNT = 2;
}
enum ShieldInteraction {
  SHIELD_INTERACTION_UNSPECIFIED = 0;
  NO_SHIELD_BREAK = 1;
  BREAK_BEFORE_HIT = 2;
  COOLDOWN_AFTER_BLOCK = 3;
}
message HeldItemCategory {
  string id = 1; // 书内局部 ID
  repeated string item_tags = 2; // 任一标签命中；末项空列表匹配其余物品
  optional int32 selection_priority = 3; // 非负，越小越优先；不同致伤类别可共用优先级
  BaseDamageSource base_damage_source = 4;
  Quantity base_damage = 5; // ITEM_ATTACK_DAMAGE 用 RATIO 倍率；FIXED_DAMAGE 用 DAMAGE_POINT
  InjuryKind injury_kind = 6;
  ShieldInteraction shield_interaction = 7;
  optional bool can_break_doors = 8;
  optional ProjectileWeaponCategory projectile_weapon = 9; // 弓或弩类别；非远程物品缺省
  repeated string ammunition_tags = 10; // 非空时覆盖书级弹药标签，可区分弓箭与弩用烟花
}
message DurabilityRule {
  repeated string item_tags = 1; // 从上到下首次命中；末项空列表兜底，只用于有耐久物品
  Quantity multiplier = 2; // RATIO，(0, 10]；无耐久物品一律按一次性排在有耐久物品之后
}
enum HandSelectionCriterion {
  HAND_SELECTION_CRITERION_UNSPECIFIED = 0;
  CATEGORY_PRIORITY = 1;
  DURABILITY_MULTIPLIER = 2;
  PREFER_MAIN_HAND = 3;
}
message HeldItemRules {
  repeated HeldItemCategory categories = 1;
  repeated DurabilityRule durability = 2;
  repeated HandSelectionCriterion selection_order = 3; // 三项各一次，PREFER_MAIN_HAND 必须最后
  repeated string ammunition_tags = 4; // 任一标签命中；用于另一只手和弹药查询
  optional bool require_ammunition = 5;
  optional bool other_hand_empty_or_ammunition = 6;
}
enum Hand {
  HAND_UNSPECIFIED = 0;
  MAIN_HAND = 1;
  OFF_HAND = 2;
}
enum HandSide {
  HAND_SIDE_UNSPECIFIED = 0;
  LEFT = 1;
  RIGHT = 2;
}
enum ProjectileWeaponCategory {
  PROJECTILE_WEAPON_CATEGORY_UNSPECIFIED = 0;
  BOW = 1;
  CROSSBOW = 2;
  HELD_SPLASH_BREW = 3; // 主手喷溅巫药；由 use_brew 处理器接收落地效果
}
message HeldItem {
  string item_id = 1; // 空字符串表示空手；空手不得携带其他信息
  repeated string tags = 2;
  optional bool damageable = 3;
  optional bool contains_items = 4;
  string brew_kind_id = 5; // 巫药种类；非巫药为空
  optional int32 brew_quality = 6; // 巫药品质组件值 [0, 3]
  optional BrewUseMethod brew_use = 7;
}
message HeldItems {
  HeldItem main_hand = 1;
  HeldItem off_hand = 2;
  HandSide main_hand_side = 3;
  optional ProjectileWeaponCategory main_hand_projectile_weapon = 4;
  optional ProjectileWeaponCategory off_hand_projectile_weapon = 5;
  optional bool can_find_ammunition = 6;
}
enum BrewUseMethod {
  BREW_USE_METHOD_UNSPECIFIED = 0;
  DRINK = 1;
  ANOINT = 2;
  THROW = 3;
  SPLASH = 4;
  FAN = 5;
  MIST = 6;
}
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  ATTACK = 1;
  DEFENSE = 2;
  MOVEMENT = 3;
  RECOVERY = 4;
  BUFF = 5;
  CULTIVATION = 6;
}
enum ModuleKind {
  MODULE_UNSPECIFIED = 0;
  MERIDIAN = 1;
  TISSUE = 2;
  ORGAN = 3;
}
message TechniqueSlot {
  string id = 1; // 功法内局部英文 ID
  ModuleKind module = 2;
  repeated string tags = 3; // 全部匹配，最多 16 个；标签和 kind 至少提供一种选择条件
  string kind = 4; // 组织或器官类型，可空；经脉不得提供
  optional int32 minimum_count = 5; // [0, 16]；0 表示可选
  optional int32 maximum_count = 6; // [1, 16]，不小于 minimum_count
  optional bool require_opened = 7; // 经脉槽必须显式声明；扣费槽必须为 true
  Quantity minimum_strength = 8; // 可缺省；组织可用力量下限，N
  RelativeArmSlot relative_arm = 9; // 组织槽按起手武器手选左右候选；仍满足 tags/kind/数量约束
}
message RelativeArmSlot {
  DrawStrengthArm arm = 1;
  repeated string left_module_ids = 2;
  repeated string right_module_ids = 3;
}
enum QiDistribution {
  QI_DISTRIBUTION_UNSPECIFIED = 0;
  EACH = 1;
  EVEN = 2;
  BY_BALANCE = 3; // 总费用按各经脉可付余额比例分摊；余额合计够即可，空经脉不分摊
}
enum QiCostMatching {
  EXACT_VARIANT = 0; // 缺省保留精确属性与相态匹配
  ANY_ATTRIBUTE_AT_LEAST_PHASE = 1; // 任意属性，库存相态不得低于 phase
  ATTRIBUTE_AT_LEAST_PHASE = 2; // 属性固定为 attribute，库存相态不得低于 phase
}
message QiCost {
  string slot_id = 1;
  string attribute = 2;
  kizuna.meridian.v1.QiPhase phase = 3;
  Quantity amount = 4; // EACH 为每条经脉的费用，EVEN 与 BY_BALANCE 为这一项的总费用，元
  QiDistribution distribution = 5; // 必须显式声明；EVEN 按经脉 ID 字典序分配余数
  QiCostMatching matching = 6; // 任意属性模式下 attribute 必须为空，其余模式必填；扣款保留实际密度
}
message WorkCost {
  string slot_id = 1; // 组织或器官，每个绑定模块各做一次功
  Quantity force = 2; // 组织必填，N；器官必须缺省
  Quantity power = 3; // W
  Quantity duration = 4; // s
  bool training = 5; // 训练做功；只允许用于声明 TissueTraining 的组织
}
message TechniqueCost { repeated QiCost qi = 1; repeated WorkCost work = 2; }
message CastPhases {
  optional int64 warmup_millis = 1;
  optional int64 active_millis = 2;
  optional int64 recovery_millis = 3;
  optional bool interruptible_by_damage = 4;
}
enum ModifierActivation {
  AT_CAST_START = 0; // 缺省保持起手登记；曲线可以延迟生效。
  AT_EFFECT_TIME = 1; // 到效果时刻才登记；此前终止不产生曲线。
}
message TissueModifier {
  string slot_id = 1;
  // 偏移单位 ms，值为无量纲 [-1, 1]；2–16 点，首点偏移 0，首尾值 0，末点是到期。
  repeated kizuna.meridian.v1.CurvePoint curve = 2;
  Quantity strength_peak = 3; // RATIO，(0, 10]
  Quantity burst_peak = 4;
  Quantity endurance_peak = 5;
  Quantity recovery_peak = 6;
  ModifierActivation activation = 7;
  Quantity tempo_peak = 8; // RATIO，动作速度倍率；缺省为 1
  // 不存在提前移除字段；库添加的每条曲线都完整运行，到期由 Framework 清理。
}
enum ImpulseDirection {
  IMPULSE_DIRECTION_UNSPECIFIED = 0;
  FORWARD = 1;
  UP = 2;
  TOWARD_TARGET = 3;
  INPUT = 4; // 输入为零或缺省时使用 input_default_direction，未声明则向前
  BACKWARD = 5;
}
message Impulse {
  ImpulseDirection direction = 1;
  Quantity speed = 2; // (0, 100] m/s
  optional ImpulseDirection input_default_direction = 3; // 仅 INPUT 可声明，FORWARD 或 BACKWARD
}
// 注册于模组初始化的增益；相同身份重复施放只刷新持续时间。
message StatusBenefit {
  string id = 1;
  int64 duration_millis = 2;
  int32 color_rgb = 3;
  LeapProfile leap = 4;
  TissueBenefitProfile tissue = 5; // 与 leap 恰有一种；状态撤销时仅清理本状态拥有的修正。
}
message TissueBenefitProfile {
  repeated TissueModifier modifiers = 1; // 同一状态可覆盖多个组织槽；曲线末点等于状态默认时长。
}
// 原版效果负责剩余时长；此元数据只恢复相位与修正归属，不独立计时。
message TissueBenefitLease {
  string status_id = 1;
  string body_id = 2;
  int32 total_ticks = 3;
  repeated string modifier_ids = 4;
}
message TissueBenefitLeases { repeated TissueBenefitLease leases = 1; }
// 声音锚点：施放者位置，或本次打击真正造成伤害的每个目标位置。
enum SoundAnchor {
  SOUND_ANCHOR_UNSPECIFIED = 0;
  CASTER = 1;
  // 声音效果里只能跟在同刻 weapon_strike、leg_strike 或 limb_strike 之后（中间可隔同刻声音），
  // 调度时并入该击的 hit_sounds；
  // 附行的 hit_sound 也用它，由伤害附属在附伤目标处播放。
  TARGET = 2;
}
// 原版声音事件的一次播放；类别固定为 PLAYERS，客户端不预测，施放者本人也只听服务端下发的一次。
message SoundCue {
  string sound_id = 1; // 命名空间声音事件 ID；可不在服务端注册表中，启动时记 WARN 并内联下发
  Quantity volume = 2; // RATIO，(0, 4]；省略为 1
  Quantity pitch = 3; // RATIO，[0.5, 2]；省略为 1
  Quantity pitch_jitter = 4; // RATIO，[0, 0.5]；每次在 pitch ± jitter 内均匀取值，两端仍在 [0.5, 2]
  SoundAnchor anchor = 5;
}
// 跃步使用所属功法的组织槽位，每次起跳重新绑定并支付 work。
// 落点限制在起点为心、maximum_path 为半径的球内；飞行 tick 由直线长度与 launch_speed 求得。
message LeapProfile {
  WorkCost work = 1;
  double minimum_distance = 2; // 已停用，必须为 0
  double maximum_distance = 3; // 已停用，必须为 0
  double fallback_distance = 4; // 已停用，必须为 0
  double maximum_rise = 5;
  double maximum_drop = 6;
  double snap_radius = 7;
  int32 flight_ticks = 8; // 已停用，必须为 0
  int32 landing_delay_ticks = 9;
  string presentation_id = 10;
  double ai_minimum_distance = 11;
  string failure_translation_key = 12;
  int32 ai_decision_ticks = 13;
  double maximum_path = 14; // 格；上升计入直线长度，下落只受 maximum_drop 限制
  double launch_speed = 15; // m/s，沿起点到落点直线的平均速度
  int32 minimum_flight_ticks = 16;
  int32 maximum_flight_ticks = 17;
  SoundCue takeoff_sound = 18; // 起跳成功时在施放者处播放，锚点只能是 CASTER
}
// 客户端只表达跳跃意图；位置与速度均由服务端回执提供。
message LeapMotion {
  enum Action { ACTION_UNSPECIFIED = 0; START = 1; FINISH = 2; ORDINARY_JUMP = 3; REQUEST = 4; }
  Action action = 1;
  int32 entity_id = 2;
  string effect_id = 3;
  double x = 4;
  double y = 5;
  double z = 6;
  double velocity_x = 7;
  double velocity_y = 8;
  double velocity_z = 9;
  double landing_y = 10;
  int64 ready_tick = 11; // FINISH：服务端世界时间达到该值后才能再次起跳
}
// 服务端僵直的显示副本；剩余 0 表示僵直结束。判定只以服务端身体时钟为准。
message StaggerStatus {
  int32 entity_id = 1;
  int64 remaining_millis = 2;
}
enum PresentationDuration {
  PRESENTATION_DURATION_UNSPECIFIED = 0;
  ONCE = 1;
  UNTIL_RECOVERY_END = 2;
}
message PresentationEffect {
  string id = 1;
  PresentationDuration duration = 2;
  int64 start_millis = 3; // 剪辑起播毫秒，缺省为 0
}
enum StrikeShape {
  STRIKE_SHAPE_UNSPECIFIED = 0;
  SINGLE_TARGET = 1;
  SECTOR = 2;
}
enum StrikeFacing {
  STRIKE_FACING_UNSPECIFIED = 0;
  STRIKE_FORWARD = 1;
  STRIKE_BACKWARD = 2;
}
enum LegSelection {
  LEG_SELECTION_UNSPECIFIED = 0;
  FRONT_LEG = 1;
  REAR_LEG = 2;
  BOTH_LEGS = 3;
}
enum ArmSelection {
  ARM_SELECTION_UNSPECIFIED = 0;
  FRONT_ARM = 1;
  REAR_ARM = 2;
  BOTH_ARMS = 3;
}
// 腿击与肢击共用；LIFT 只能用于 limb_strike，竖直速度写在 LimbStrike.lift_speed。
enum LegKnockbackKind {
  LEG_KNOCKBACK_UNSPECIFIED = 0;
  NONE = 1;
  PUSH = 2;
  SIDEWAYS = 3;
  TRIP = 4;
  DOWN = 5;
  LIFT = 6;
}
message LegRules {
  optional bool ignore_held_items = 1;
  optional bool require_grounded = 2;
  Quantity base_damage = 3; // DAMAGE_POINT，光脚基础伤害
  Quantity armor_damage = 4; // DAMAGE_POINT，每点靴子护甲增加的伤害
  optional int32 durability_cost = 5; // 每式最后一击扣除的靴子耐久
}
message ArmRules {
  optional bool ignore_held_items = 1; // 必须为 true
  optional bool require_grounded = 2; // 必须为 true，失败码沿用 NOT_GROUNDED
  Quantity base_damage = 3; // DAMAGE_POINT，(0, 1e9]，空手基础伤害
}
message TechniqueHostFacts {
  optional bool grounded = 1;
  optional bool in_water = 2;
  optional bool climbing = 3;
  optional bool riding = 4;
  optional bool gliding = 5;
  optional double boot_armor = 6;
  optional int32 boot_durability = 7;
}
message LegStrike {
  StrikeShape shape = 1;
  StrikeFacing facing = 2;
  Quantity distance = 3; // METER，(0, 1024]
  Quantity angle = 4; // DEGREE，扇形 (0, 360]；单体固定 60 度后备锥
  Quantity multiplier = 5; // RATIO，(0, 10]
  optional int32 maximum_targets = 6;
  optional int32 cast_target_limit = 7;
  LegSelection leg = 8;
  string damage_type_id = 9; // 目录直接提供的 Damage 身份
  LegKnockbackKind knockback_kind = 10;
  Quantity knockback = 11; // RATIO，[0, 10]，交由宿主换算
  optional bool knockback_when_blocked = 12;
  optional bool last_strike = 13;
  string dedup_group = 14; // 必填局部标识，同次施放内同组每目标只命中一次
}
// 拳掌与腿的打击。1–14 号字段与 LegStrike 同号、同名、同类型，腿击可按线格式直接重读成肢击。
message LimbStrike {
  StrikeShape shape = 1;
  StrikeFacing facing = 2;
  Quantity distance = 3; // METER，(0, 1024]
  Quantity angle = 4; // DEGREE，扇形 (0, 360]；单体固定 60 度后备锥
  Quantity multiplier = 5; // RATIO，(0, 10]
  optional int32 maximum_targets = 6;
  optional int32 cast_target_limit = 7;
  oneof limb {
    LegSelection leg = 8; // 所属书须声明 leg_rules
    ArmSelection arm = 15; // 所属书须声明 arm_rules
  }
  string damage_type_id = 9;
  LegKnockbackKind knockback_kind = 10;
  Quantity knockback = 11; // RATIO，[0, 10]；LIFT 时为水平分量，可为 0
  optional bool knockback_when_blocked = 12;
  optional bool last_strike = 13;
  string dedup_group = 14;
  Quantity lift_speed = 16; // METERS_PER_SECOND，(0, 100]；只有 LIFT 填写
}
message WeaponStrike {
  StrikeShape shape = 1;
  Quantity distance = 2; // METER，(0, 1024]
  Quantity angle = 3; // DEGREE，扇形 (0, 360]；单体固定 60 度后备锥
  Quantity facing_offset = 4; // DEGREE，[-180, 180]，相对打击时朝向
  Quantity multiplier = 5; // RATIO，(0, 10]
  optional int32 maximum_targets = 6; // 本次打击上限，单体必须为 1
  optional int32 cast_target_limit = 7; // 整次施放不同目标共享上限，各次打击必须一致
  Quantity knockback = 8; // RATIO，[0, 10]，交由宿主换算击退
  optional bool can_two_hand = 9;
  Quantity two_hand_multiplier = 10; // RATIO，不能双手时为 1
  optional bool break_shield = 11; // 配合命中物品类别的 shield_interaction
  optional InjuryKind injury_override = 12; // 缺省沿用物品类别；叩击可声明 BLUNT
  optional bool last_strike = 13; // 最后一次打击扣耐久，挥空也扣
  optional int32 durability_base = 14; // 各次打击一致，乘书级耐久倍率
  optional int64 shield_cooldown_millis = 15; // break_shield=false 时为 0
  optional int64 shield_break_millis = 16; // BREAK_BEFORE_HIT 使用；与挡后冷却分别配置
  string dedup_group = 17; // 必填局部标识，同次施放内同组每目标只命中一次
  string main_hand_damage_type_id = 18; // 与副手 ID 成对；显式直读模式只支持单手
  string off_hand_damage_type_id = 19;
}
message BreakBlocks {
  Quantity forward_distance = 1; // METER，(0, 1024]
  Quantity width = 2; // METER，(0, 1024]
  repeated string block_tags = 3; // 任一命中；宿主归并门上下两半
  optional int32 maximum_doors = 4;
}
message WeaponStrikeIntent {
  WeaponStrike strike = 1;
  HeldItemRules held_item_rules = 2; // 按打击时选定手的当前物品重新匹配
  repeated SoundCue hit_sounds = 3; // 并入的 TARGET 声音，在每个真正受伤的目标处各播一次
}
message LegStrikeIntent {
  LegStrike strike = 1;
  LegRules leg_rules = 2; // 起手保存的书级鞋规则
  repeated SoundCue hit_sounds = 3; // 并入的 TARGET 声音，在每个真正受伤的目标处各播一次
}
// 1–3 号字段与 LegStrikeIntent 同号；腿击意图可按线格式直接重读。
message LimbStrikeIntent {
  LimbStrike strike = 1;
  LegRules leg_rules = 2; // 出腿时填写
  repeated SoundCue hit_sounds = 3;
  ArmRules arm_rules = 4; // 出拳掌时填写
}
// 擒和摔都带上起手保存的书级拳掌规则，处理器按它算伤害。
message GrappleIntent {
  Grapple grapple = 1;
  ArmRules arm_rules = 2;
}
message ThrowIntent {
  Throw throw = 1;
  ArmRules arm_rules = 2;
}
message BreakBlocksIntent {
  BreakBlocks blocks = 1;
  HeldItemRules held_item_rules = 2;
}
message ConvergeProjectile {
  int64 reference_shot_millis = 1; // 参考平射的原剪辑时刻
  Quantity reference_speed_multiplier = 2; // RATIO，估算平射飞行时间的初速倍率
  optional int64 arrival_delay_millis = 3; // 比参考平射晚到的毫秒数
  LobProjectile fallback = 4; // 求解失败时使用的普通抛射；也规定汇聚初速上限
  Quantity minimum_elevation = 5; // DEGREE，汇聚解的最小仰角
}
message LobProjectile {
  Quantity maximum_distance = 1; // METER，落点搜索距离上限
  Quantity radius = 2; // METER，落点水平随机半径
  Quantity elevation = 3; // DEGREE，普通抛射仰角
  Quantity maximum_speed_multiplier = 4; // RATIO，求解初速相对原版的上限
}
enum DrawStrengthArm {
  DRAW_STRENGTH_ARM_UNSPECIFIED = 0;
  OTHER_ARM = 1; // 起手选定武器手的另一条臂
  WEAPON_ARM = 2;
}
message LaunchProjectile {
  ProjectileWeaponCategory projectile_weapon = 1;
  Quantity speed_multiplier = 2; // RATIO
  Quantity damage_multiplier = 3; // RATIO
  optional bool critical = 4;
  optional int32 piercing = 5;
  Quantity spread = 6; // DEGREE
  oneof direction {
    bool look = 7;
    Quantity look_offset = 8; // DEGREE；由宿主按持弩手镜像
    LobProjectile lob = 9;
    ConvergeProjectile converge = 10;
  }
  optional Quantity target_snap_angle = 11; // DEGREE；在扇面内吸附最近目标
  optional bool multiply_draw_strength = 12;
  DrawStrengthArm draw_strength_arm = 13; // multiply_draw_strength=true 时必须明确指定
  optional int64 shield_cooldown_millis = 14;
  optional bool mirror_by_hand = 15;
  UseBrew brew = 16; // HELD_SPLASH_BREW 必填，随弹丸保存到落地
}
message LaunchProjectileIntent {
  LaunchProjectile projectile = 1;
  HeldItemRules held_item_rules = 2;
  int64 cast_started_millis = 3; // 本次起手的身体时钟
  int64 clip_start_millis = 4; // 承接跳过的原剪辑毫秒
}
message TargetLockIntent { Quantity maximum_distance = 1; }
message FollowUp {
  TechniqueReference previous = 1;
  Quantity recovery_start_ratio = 2; // RATIO，[0, 1]；后半段填 0.5
  optional int64 after_recovery_millis = 3; // 结束后窗口；设计值 500
  optional int64 start_millis = 4; // 后式跳过的预备剪辑毫秒，必须小于起手时长
  optional ProjectileWeaponCategory previous_projectile_weapon = 5;
  optional ProjectileWeaponCategory next_projectile_weapon = 6;
}
message FollowUpRules {
  repeated FollowUp transitions = 1;
  bool only_follow_up = 2;
}
message TechniqueEffect {
  optional int64 at_millis = 1; // 相对起手的生效时刻，非负且不晚于收势结束
  oneof operation {
    TissueModifier tissue_modifier = 2;
    Impulse impulse = 3;
    PresentationEffect presentation = 4;
    WeaponStrike weapon_strike = 5;
    BreakBlocks break_blocks = 6;
    StatusBenefit status_benefit = 7;
    SoundCue sound = 8;
    LegStrike leg_strike = 20;
    LaunchProjectile launch_projectile = 9;
    WorkCost work = 10; // 在 at_millis 开始该段做功；排队不扣费，到时与已付序号原子提交。
    BlockWork block_work = 21;
    UseBrew use_brew = 22;
    OrganRefine organ_refine = 23;
    ElementalInfusion elemental_infusion = 24; // 到时由本库写进身体，不产生世界效果意图
    LimbStrike limb_strike = 25; // 同一式不能和 leg_strike 混用
    Grapple grapple = 26; // 附属处理器认领；所属书须声明拳掌规则
    Throw throw = 27; // 附属处理器认领；只摔同一施放擒住的目标
  }
}
// 炼化：宿主每批从经脉槽取料送入器官槽，按身体相态在配方族里选具体配方。
// 施放结束或被打断后不再下发新批；已开始的批次由宿主照常完成。
message OrganRefine {
  string organ_slot_id = 1; // ORGAN 槽，至少绑定一个器官
  string meridian_slot_id = 2; // MERIDIAN 槽，取料与送回的经脉
  string recipe_family = 3; // namespace:path，宿主按 器官种类 × 相态 解析
  int64 batch_millis = 4; // 每批间隔，> 0
  int64 duration_millis = 5; // 起批窗口，> 0；批次在 [at, at + duration) 内起
}
// 附行：效果时刻起，主人每次可附伤的命中另打一记本行伤害。一身只有一个附行，新的覆盖旧的。
// 哪些命中可附伤、落在哪里、原版附带怎么做都由伤害附属决定；本库只保存状态并算出附伤数值。
message ElementalInfusion {
  string attribute = 1; // 本行属性 ID，例如 meridian:fire
  string damage_type_id = 2; // 附伤使用的原版伤害类型 ID
  Quantity ratio = 3; // RATIO，(0, 10]，附伤占主击剂量的比例
  // 偏移单位 ms，相对效果时刻，值为 [0, 1]；2–16 点，首点偏移 0，首尾值 0，末点是到期，不超过 300000。
  repeated kizuna.meridian.v1.CurvePoint curve = 4;
  int32 ignite_ticks = 5; // [0, 1200]，目标着火刻数；0 不点火
  int32 freeze_ticks = 6; // [0, 1200]，目标冻结刻数增量；0 不冻结
  Quantity extra_knockback = 7; // RATIO，[0, 10]，原版击退强度；省略为 0
  repeated InfusionCounter counters = 8; // 按目标主属性取倍率，目标属性不重复；未列出的为 ×1
  SoundCue hit_sound = 9; // 锚点必须是 TARGET；省略不播
}
// 目标主属性是 target_attribute 时，附伤与命中声的调整。
message InfusionCounter {
  string target_attribute = 1;
  Quantity damage_multiplier = 2; // RATIO，(0, 10]
  Quantity sound_volume_multiplier = 3; // RATIO，(0, 4]；省略为 1，乘后音量不超过 4
  Quantity sound_pitch_offset = 4; // RATIO，[-1.5, 1.5]；省略为 0，加后音调夹回原版可播放区间
}
message BlockWork {
  string processor_id = 1;
  repeated string block_tags = 2; // 目标方块任一标签命中
  Quantity maximum_distance = 3; // METER
  int64 interval_millis = 4;
  int64 duration_millis = 5;
}
// 擒：处理器选单体目标拉到施放者身前并锁住，到时放手；施放结束或被打断时立刻放手。
// 摔不动的目标不擒，改在 lean.delay_millis 后用肩撞开。
message Grapple {
  string processor_id = 1;
  Quantity maximum_distance = 2; // METER，(0, 64]
  Quantity hold_distance = 3; // METER，(0, maximum_distance]，拉到施放者身前的距离
  int64 duration_millis = 4; // 正数，不超过施放剩余时长；随施放速度缩放
  ThrowLean lean = 5;
}
// 一靠：按书级空手伤害乘倍率打一下并推开，处理器另给施放者提示摔不动。
message ThrowLean {
  int64 delay_millis = 1; // 相对擒的时刻，非负，不晚于擒的时长；随施放速度缩放
  string damage_type_id = 2;
  Quantity multiplier = 3; // RATIO，(0, 10]
  Quantity push = 4; // RATIO，[0, 10]
}
// 摔：把同一施放擒住的目标沿弧线抛过施放者头顶，落在身后；落地按书级空手伤害结算一次并倒地。
message Throw {
  string processor_id = 1;
  int64 flight_millis = 2; // 正数，随施放速度缩放
  Quantity landing_distance = 3; // METER，(0, 64]，落在施放者身后的距离
  Quantity apex_height = 4; // METER，[0, 16]，最高点高出施放者头顶
  string damage_type_id = 5;
  Quantity multiplier = 6; // RATIO，(0, 10]
  int64 down_millis = 7; // 正数，倒地时长，不随施放速度缩放
  int64 down_immunity_millis = 8; // 非负，起来以后这段时间内不会再被摔倒
}
message UseBrew {
  string processor_id = 1;
  repeated string brew_kind_ids = 2;
  repeated BrewUseMethod use_methods = 3;
  BrewTechniqueParameters technique = 4; // 缺省时保留原始物品用法
  SoundCue preparation_sound = 5; // 只播准备动作声音，不消耗药瓶
  BrewPartGroup sound_group = 6;
}
enum BrewPartGroup {
  BREW_PART_GROUP_UNSPECIFIED = 0;
  HEAD_NECK = 1;
  TORSO = 2;
  ARMS = 3;
  LEGS = 4;
  FRONT_CHEST_ARMS = 5;
}
message BrewTechniqueParameters {
  BrewUseMethod method = 1;
  double strength_multiplier = 2;
  double duration_multiplier = 3;
  int32 strength_quality_steps = 4;
  double maximum_quality_multiplier = 5;
  double nausea_multiplier = 6;
  double residue_dose = 7; // 零表示不留残药
  Quantity range = 8;
  Quantity fan_angle = 9;
  int32 maximum_targets = 10;
}
message BrewItemRequirement {
  repeated string kind_ids = 1;
  repeated BrewUseMethod physical_uses = 2;
  bool empty_off_hand = 3;
}
message Presentation {
  string icon_id = 1;
  string description = 2;
  string particle_id = 3;
  string sound_id = 4; // 已废弃，必须为空；声音改用 TechniqueEffect.sound
  string display_name = 5; // 无语言条目时使用的式名，不使用资源 ID 作为名称
}
message AiHints {
  Quantity minimum_distance = 1; // m，[0, 1024]
  Quantity maximum_distance = 2;
  Quantity maximum_hp_ratio = 3; // [0, 1]
  Quantity minimum_qi_ratio = 4;
  Quantity category_weight = 5; // [0, 100]
  CombatAiHints combat = 6;
  SupportAiHints support = 7; // 可缺省；设了 role 的式不进打击选式，由宿主大脑按角色施放
}
enum AiRole {
  AI_ROLE_UNSPECIFIED = 0; // 打击式，按情境评分选择
  AI_ROLE_PREPARE = 1;     // 接敌前准备；类别须为 BUFF
  AI_ROLE_RECOVER = 2;     // 远离威胁时恢复；类别须为 RECOVERY
  AI_ROLE_REPOSITION = 3;  // 取得机动状态，用于突击与拉扯
}
message SupportAiHints {
  AiRole role = 1;
  optional int32 order = 2;                        // 同角色先后，小者先放，[0, 100]，缺省 0
  Quantity minimum_fatigue_ratio = 3;              // 可缺省；RATIO，[0, 1]，所绑定肌肉疲劳比达到此值才放
  optional bool requires_melee_weapon = 4;         // 主手须为近战武器
  optional int64 refresh_before_expiry_millis = 5; // 本式给予的状态剩余不超过此值时补放，[0, 86400000]
}
message CombatAiHints {
  Quantity target_shielding_weight = 1; // 可缺省；RATIO，[0, 100]，命中情境时乘权重
  Quantity surrounded_weight = 2;
  Quantity under_attack_weight = 3;
  Quantity pursued_weight = 4;
  optional int64 maximum_warmup_under_attack_millis = 5;
  Quantity maximum_long_warmup_distance = 6; // 与 long_warmup_millis 同时提供
  optional int64 long_warmup_millis = 7;
  Quantity target_behind_weight = 8;
  Quantity target_airborne_weight = 9;
  Quantity self_fleeing_weight = 10;
  Quantity minimum_leg_force = 11; // NEWTON；两腿有效力量下限
  TargetDistanceBand target_distance_band = 12;
  Quantity target_hidden_weight = 13;
  Quantity target_moving_weight = 14;
  Quantity self_approached_weight = 15;
  Quantity ammunition_weight = 16;
  Quantity reserve_weapon_weight = 17;
  Quantity target_casting_weight = 18; // 对方正在起手
  Quantity target_downed_weight = 19; // 对方倒地
  Quantity target_armored_weight = 20; // 对方被打部位护甲高，由宿主判定
}
enum TargetDistanceBand {
  TARGET_DISTANCE_BAND_UNSPECIFIED = 0;
  NEAR = 1;
  MEDIUM = 2;
  FAR = 3;
}
message TechniqueDefinition {
  string id = 1;
  int32 version = 2;
  Category category = 3;
  kizuna.meridian.v1.Realm minimum_realm = 4;
  repeated TechniqueSlot slots = 5;
  TechniqueCost cost = 6;
  CastPhases phases = 7;
  optional int64 cooldown_millis = 8; // 从收势结束计时；提前终止从终止时刻计时，[0, 86400000]
  repeated TechniqueEffect effects = 9; // 按 at_millis 非递减排序，同刻保持声明顺序
  AiHints ai_hints = 10;
  Presentation presentation = 11;
  reserved 12;
  reserved "lock_movement";
  FollowUpRules follow_up = 13;
  optional double movement_speed_multiplier = 14; // [0,1]，缺省为 1；全程限速，不缩放冲量
  bool allow_use_while_casting = 15; // 施放中放行玩家右键（用物品、放方块、与方块/实体交互）；缺省拦截
  optional ProjectileWeaponCategory projectile_weapon = 16;
  optional bool require_ammunition = 17; // 覆盖书级要求；拉空弓显式填 false
  optional bool lock_target = 18;
  Quantity target_lock_distance = 19; // lock_target=true 时必须声明，单位 METER
  optional bool allow_off_hand_use_while_casting = 20;
  repeated string off_hand_use_block_tags = 21;
  BrewItemRequirement brew_item = 22; // 主手必须满足，先于费用与起手校验
}

enum TechniqueFailure {
  TECHNIQUE_FAILURE_UNSPECIFIED = 0;
  UNKNOWN_TECHNIQUE = 1;
  NOT_KNOWN = 2;
  COOLING_DOWN = 3;
  ALREADY_CASTING = 4;
  BODY_UNAVAILABLE = 5;
  REALM_TOO_LOW = 6;
  MISSING_MODULE = 7;
  MERIDIAN_NOT_OPENED = 8;
  MODULE_UNAVAILABLE = 9;
  INSUFFICIENT_CAPABILITY = 10;
  INSUFFICIENT_QI = 11;
  CAST_ID_CONFLICT = 12;
  INVALID_STATE = 13;
  FRAMEWORK_REJECTED = 14;
  INVALID_REQUEST = 15;
  NO_HOST = 16; // 宿主发现由后续 Fabric 服务负责
  HELD_ITEM_REQUIRED = 17;
  HELD_ITEM_UNUSABLE = 18;
  FOLLOW_UP_REQUIRED = 19;
  FOLLOW_UP_UNAVAILABLE = 20;
  STAGGERED = 21; // 受击僵直未到期，不能起新式
  NOT_GROUNDED = 22; // 腿法要求施放者站在地上
  BOW_REQUIRED = 23;
  CROSSBOW_REQUIRED = 24;
  OTHER_HAND_AMMUNITION_REQUIRED = 25;
  AMMUNITION_REQUIRED = 26;
  EFFECT_REJECTED = 27;
  DRINK_BREW_REQUIRED = 28;
  SPLASH_BREW_REQUIRED = 29;
  BREW_REQUIRED = 30;
  ANOINT_OFF_HAND_REQUIRED = 31;
  BREW_KIND_REQUIRED = 32;
  INSUFFICIENT_ATTRIBUTE_QI = 33; // 指定属性的真元不足或相态不够
}
message BoundSlot { string slot_id = 1; ModuleKind module = 2; repeated string module_ids = 3; }
message TechniqueBinding {
  string body_id = 1;
  int64 revision = 2;
  repeated BoundSlot slots = 3;
}
message BindingOutcome {
  TechniqueBinding binding = 1; // 成功时存在
  TechniqueFailure failure = 2;
  string reason = 3; // 失败时指出槽位及未满足条件
}
message CastRequest {
  string body_id = 1;
  TechniqueReference technique = 2;
  string target_id = 3; // 可空，宿主解释；请求不能携带费用、效果剂量或学会记录
  string cast_id = 4; // 身体内唯一；[A-Za-z0-9_-]，1–64 字符
  HorizontalDirection direction = 5;
  CastEntry entry = 6; // AUTO 自动承接可用窗口，否则普通起手；FOLLOW_UP 强制要求窗口
}
enum CastEntry {
  AUTO = 0;
  FOLLOW_UP = 1;
}
// 只传水平输入方向，不表示速度；分量须为有限数。缺省或全零使用冲量声明的默认方向。
message HorizontalDirection { double x = 1; double z = 2; }
enum PresentationAction {
  PRESENTATION_ACTION_UNSPECIFIED = 0;
  PLAY_ONCE = 1;
  START = 2;
  STOP = 3;
}
message PresentationIntent {
  string id = 1;
  PresentationAction action = 2;
  int64 start_millis = 3; // STOP 必须为 0
  optional double playback_speed_multiplier = 4; // 动作速度倍率；缺省为 1
}
enum MovementAction {
  MOVEMENT_ACTION_UNSPECIFIED = 0;
  LOCK = 1; // 应用施放移动倍率；保留稳定操作身份，不再锁死移动
  UNLOCK = 2;
}
message MovementIntent {
  MovementAction action = 1;
  optional double movement_speed_multiplier = 2; // LOCK 为 [0,1]，缺省 1；UNLOCK 不携带倍率
  bool allow_use_while_casting = 3; // 只随 LOCK 下发本次是否放行右键；UNLOCK 不携带
  bool allow_off_hand_use_while_casting = 4;
  repeated string off_hand_use_block_tags = 5;
}
// 世界效果只交给宿主，不包含身体修正。
message EffectIntent {
  string cast_id = 1;
  string target_id = 2;
  HorizontalDirection direction = 3;
  string effect_id = 4; // 施放内稳定 ID，独立于 tick 批次；同一 ID 重试不得重复执行
  Hand selected_hand = 5; // 施放起手选定；无持物规则时未指定
  int64 scheduled_millis = 6; // 权威身体时钟；迟到 tick 不改变原生效时刻
  optional bool lock_target = 7;
  TechniqueReference technique = 8; // 调度器填本次施放的精确式，宿主报打中用；旧存档里的清理意图可缺省
  oneof operation {
    Impulse impulse = 10;
    PresentationIntent presentation = 11;
    MovementIntent movement = 12;
    WeaponStrikeIntent weapon_strike = 13;
    BreakBlocksIntent break_blocks = 14;
    StatusBenefit status_benefit = 15;
    SoundCue sound = 16; // 只承载 CASTER，由功法服务交给声音监听者，不提交宿主
    LegStrikeIntent leg_strike = 20;
    LaunchProjectileIntent launch_projectile = 17;
    TargetLockIntent target_lock = 18;
    BlockWork block_work = 21;
    UseBrew use_brew = 22;
    OrganRefineIntent organ_refine = 23;
    LimbStrikeIntent limb_strike = 24;
    GrappleIntent grapple = 25;
    ThrowIntent throw = 26;
  }
}
message OrganRefineIntent {
  repeated string organ_ids = 1; // 起手绑定的器官
  repeated string meridian_ids = 2; // 起手绑定的经脉
  string recipe_family = 3;
  int64 batch_millis = 4; // 已按施放速度缩放
  int64 window_end_millis = 5; // 权威身体时钟上的起批窗口终点；不得在此后起新批
}
message TechniqueHostRequest {
  string entity_uuid = 1;
  string request_id = 2;
  int64 expected_revision = 3; // activity 的身体版本；其他操作必须为 0
  oneof operation {
    bool inspect = 10;
    kizuna.meridian.v1.BodyActivity activity = 11;
    EffectIntent effect = 12;
  }
}
message TechniqueActivityCommit {
  int64 revision = 1;
  kizuna.meridian.v1.BodyActivity activity = 2;
}
message TechniqueHostResponse {
  string request_id = 1;
  HeldItems held_items = 2; // body 回执必须携带，与身体同一次 inspect 采集
  TechniqueHostFacts inspect_facts = 20; // body 回执必须携带，与身体同一次 inspect 采集
  oneof result {
    bool unbound = 10;
    kizuna.meridian.v1.BodySnapshot body = 11;
    TechniqueActivityCommit activity = 12;
    bool effect_accepted = 13;
    kizuna.meridian.v1.RequestFailure failure = 14;
  }
}
enum CastPhase {
  CAST_PHASE_UNSPECIFIED = 0;
  IDLE = 1;
  WARMUP = 2;
  EFFECTIVE = 3;
  RECOVERING = 4;
  FINISHED = 5;
  INTERRUPTED = 6;
  CANCELLED = 7;
}
message CastOutcome {
  string cast_id = 1;
  CastPhase phase = 2;
  TechniqueFailure failure = 3;
  string reason = 4;
  int64 revision = 5;
  TechniqueBinding binding = 6;
  kizuna.meridian.v1.FailureCode framework_failure = 7;
  bool replayed = 8;
}
message KnownTechnique {
  TechniqueReference technique = 1;
  Quantity proficiency = 2; // RATIO，[0, 1]，只供未来 AI 权重使用
  string source = 3; // namespace:path，可信学会来源
  optional int64 learned_millis = 4;
}
message ActiveCast {
  CastRequest request = 1;
  int64 started_millis = 2;
  int64 warmup_end_millis = 3;
  int64 active_end_millis = 4;
  int64 recovery_end_millis = 5;
  string action_instance_id = 6;
  TechniqueBinding binding = 7;
  optional bool interruptible_by_damage = 8;
  Hand selected_hand = 9;
  reserved 10;
  reserved "lock_movement";
  optional int64 cooldown_millis = 11; // 固定本次冷却长度，缺省的旧存档保留原冷却
  repeated TechniqueEffect presentations = 12; // 保留停止所需的表现声明，目录卸载后仍可清理
  int64 clip_start_millis = 13;
  HeldItemRules held_item_rules = 14;
  repeated EffectIntent predecessor_cleanup = 15; // 原式清理与新起手同次保存，可稳定重试
  optional double movement_speed_multiplier = 16; // 固定本次限速，缺省为 1
  bool allow_use_while_casting = 17; // 固定本次是否放行右键，旧存档缺省为拦截
  LegRules leg_rules = 30; // 固定本次书级腿法规则
  ArmRules arm_rules = 31; // 固定本次书级拳掌规则
  optional bool lock_target = 18;
  Quantity target_lock_distance = 19;
  repeated int32 paid_work_sequences = 20; // 已付分段做功在原目录 effects 中的序号，随身体保存。
  repeated kizuna.meridian.v1.CapabilityModifier pending_modifiers = 21; // 已绑定、尚未登记的到时曲线。
  optional bool allow_off_hand_use_while_casting = 22;
  repeated string off_hand_use_block_tags = 23;
  optional double tempo_multiplier = 24; // 起手冻结的最慢组织动作速度
}
message LastCast {
  TechniqueReference technique = 1;
  string cast_id = 2;
  int64 active_end_millis = 3;
  int64 recovery_end_millis = 4; // 保留正常边界，提前承接不提前开始前式冷却
  CastPhase ending = 5; // 只有 FINISHED 可用于收势后的承接
}
// 身体上的附行，一身至多一个；按身体时钟在查询时判断到期，不主动清除。
message ActiveInfusion {
  string cast_id = 1;
  string technique_id = 2;
  int64 started_millis = 3; // 效果时刻对应的身体毫秒，曲线从这里起算
  ElementalInfusion infusion = 4; // 定义快照：目录改了或卸载了，已生效的附行不变
}
message TechniqueProgress {
  int32 schema_version = 1; // 1；Any 的完整大小不得超过 Framework 的 64 KiB 上限
  repeated KnownTechnique known = 2;
  map<string, int64> cooldowns = 3; // 功法 ID → 冷却结束的身体毫秒，跨版本共用冷却
  ActiveCast active_cast = 4; // 至多一个；结束后清除，知识与冷却保留
  map<string, int64> curve_ends = 5; // 功法 ID → 已提交修正的最晚到期；提前终止也不撤销
  LastCast last_cast = 6;
  ActiveInfusion active_infusion = 7; // 收势不清除；身体死亡时由可信恢复入口清除
}
